<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BomplimentsAPI</title>
</head>
    <body>
    <div class="card">
        <h1>BomplimentsAPI</h1>
        <p class="subtitle">Um elogio do fundo do coração para alegrar seu dia</p>

        <div class="search-row">
            <input type="text" id="searchInput" placeholder="Número de 1 a 40">
            <button id="buscar">Buscar</button>
        </div>

        <div id="result"></div>
    </div>
<script>
    button = document.getElementById('buscar');
    button.addEventListener('click', buscarElogio);

async function buscarElogio() {
  const id = document.getElementById('searchInput').value;
  const resultDiv = document.getElementById('result');

  if (!id) {
    resultDiv.textContent = 'Digite um ID válido';
    return;
  }

  try {
    const resposta = await fetch(`https://back-2182.onrender.com/elogios/${id}`);
    const dados = await resposta.json();

    if (resposta.ok) {
      resultDiv.textContent = dados.mensagem;
    } else {
      resultDiv.textContent = dados.erro;
    }
  } catch (erro) {
    resultDiv.textContent = 'Erro ao conectar com o servidor. O Flask tá rodando?';
  }
}

       </script>
    </body>
</html>

 
</body>
</html>
